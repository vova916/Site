<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Додати новину / спогад</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background: #0f0f0f;
        color: #f1f1f1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    form {
        background: #1a1a1a;
        padding: 40px 50px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        width: 400px;
        gap: 15px;
    }

    label {
        margin-bottom: 5px;
        font-weight: bold;
    }

    input[type="text"], textarea {
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        background: #0f0f0f;
        color: #f1f1f1;
        width: 100%;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    input[type="text"]:focus, textarea:focus {
        outline: 2px solid #ffcc00;
    }

    .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
    }

    .file-input-wrapper button {
        padding: 12px;
        background: #ffcc00;
        border: none;
        border-radius: 12px;
        color: #0f0f0f;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(255,204,0,0.5);
        width: 100%;
    }

    .file-input-wrapper button:hover {
        background: #ffaa00;
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(255,170,0,0.6);
    }

    .file-input-wrapper input[type=file] {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
    }

    .radio-group {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    button.submit-btn {
        padding: 12px;
        background: #ffcc00;
        border: none;
        border-radius: 12px;
        color: #0f0f0f;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(255,204,0,0.5);
    }

    button.submit-btn:hover {
        background: #ffaa00;
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(255,170,0,0.6);
    }
</style>
</head>
<body>

<form action="/news" method="post" enctype="multipart/form-data">
    <label for="title">Заголовок:</label>
    <input type="text" name="title" id="title" required>

    <label for="content">Текст:</label>
    <textarea name="content" id="content" required></textarea>

    <label>Тип:</label>
    <div class="radio-group">
        <label><input type="radio" name="memory" value="0" checked> Новина</label>
        <label><input type="radio" name="memory" value="1"> Спогад</label>
    </div>

    <label for="image">Фото (необов'язково):</label>
    <div class="file-input-wrapper">
        <button type="button">Вибрати файл</button>
        <input type="file" name="image" id="image" accept="image/*">
    </div>

    <button type="submit" class="submit-btn">Додати</button>
</form>

</body>
</html>
