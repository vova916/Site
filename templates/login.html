<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        
body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: #0f0f0f;
    color: #f1f1f1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


form {
    background: #1a1a1a;
    padding: 40px 50px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    width: 300px;
}


input[type="text"],
input[type="password"] {
    padding: 12px;
    margin-bottom: 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}


input[type="submit"] {
    padding: 12px;
    background: #ffcc00;
    border: none;
    border-radius: 12px;
    color: #0f0f0f;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    font-size: 16px;
}

input[type="submit"]:hover {
    background: #ffaa00;
}


form label {
    margin-bottom: 5px;
    font-weight: bold;
    display: block;
}




    </style>
</head>
<body>
    <form action="/login" method="POST">
        Логін: <input type="text" name="username"><br>
        Пароль: <input type="password" name="password"><br>
    <input type="submit" value="Вхід">
    </form>
</body>
</html>
